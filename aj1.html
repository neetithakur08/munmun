<html>
 <head>
  <script src="angular.min.js"></script>
 </head>
 <body ng-app="myApp">
  <div ng-controller="myctrl">
   <p>lowercase:{{name|uppercase}}</p>
   <p>uppercase:{{name|lowercase}}</p>
   <p>number:{{price|number:2}}</p>
   <p>date:{{today|'dd-MM-yyyy'}}</p>
   <p>orderby:</p>
   <ul>
   <li ng-repeat="x in names"|orderBy>{{x}}</li>
   </ul>


<script>
 var app=angular.module("myApp",[]);
 app.controller("myctrl",function($scope)
 {
  $scope.name="Neeti Thakur";
  $scope.price=1234566.78;
  $scope.names=["hel","yhiok","kjuhg","linon"];
});
</script>
   </div>
  </body>
</html>
